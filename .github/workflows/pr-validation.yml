name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Auth tests
        run: npm run test:auth

      - name: MCP server build, type check and tests
        run: |
          npm run typecheck -w mcp-server
          npm run build -w mcp-server
          npm test -w mcp-server
